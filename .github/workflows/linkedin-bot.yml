name: LinkedIn Comment Bot

on:
  workflow_dispatch:        # manual trigger only — auto-schedule removed

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the updated log file back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Write LinkedIn session file from secret
        run: echo "$LINKEDIN_SESSION_JSON" | base64 -d > linkedin_session.json
        env:
          LINKEDIN_SESSION_JSON: ${{ secrets.LINKEDIN_SESSION_JSON }}

      - name: Run comment bot
        run: python3 linkedin_comment_bot.py --post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}

      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/debug_*.png
          if-no-files-found: ignore

      - name: Commit updated comment log
        run: |
          git config user.name "linkedin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add commented_posts.json
          git diff --staged --quiet || git commit -m "bot: update comment log $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
